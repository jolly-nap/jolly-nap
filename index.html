<!doctype html>
<html>
	<head>
		<title>Jolly Nap</title>
		<meta content="Teffen Ellis" name="author" />
		<meta content="Jolly Nap" name="title" />
		<meta content="Get the most out of your nap." name="description" />
		<meta content="jolly nap, nap, sleepytime, sleepyti.me" name="keywords" />
		<meta charset="utf-8" />
		<meta content="Jolly Nap" property="og:title" />
		<meta content="website" property="og:type" />
		<meta content="https://sleep.sister.software" property="og:url" />
		<meta content="https://sleep.sister.software/icons/icon-ios-marketing-1024x1024.png" property="og:image" />
		<meta content="Jolly Nap" property="og:site_name" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Jolly Nap" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="theme-color" content="#333333" />
		<meta
			content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
			name="viewport"
		/>
		<link href="manifest.webmanifest" rel="manifest" />
		<link href="stylesheets/application.css" rel="stylesheet" type="text/css" />
		<link href="//fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet" type="text/css" />
		<link href="favicon.ico" rel="shortcut icon" type="image/vnd.microsoft.icon" />
		<link href="icons/icon-iphone-29x29@2x.png" rel="apple-touch-icon" sizes="58x58" />
		<link href="icons/icon-iphone-29x29@3x.png" rel="apple-touch-icon" sizes="87x87" />
		<link href="icons/icon-ios-marketing-1024x1024.png" rel="apple-touch-icon" sizes="1024x1024" />
		<script src="javascripts/add2home.js" type="text/javascript"></script>
	</head>
	<body>
		<div id="fb-root"></div>
		<div class="wrapper">
			<header class="site-header">
				<span class="logo">Jolly Nap</span>
				<div class="subtitle">Sleep Calculator</div>
			</header>
			<div class="content">
				<div class="get-up blurb">When do you have to wake up?</div>
				<div class="wake-up-container">
					<label for="wake-up-time">Wake Up Time</label
					><input id="wake-up-time" name="wake-up-time" step="60" type="time" value="00:00" />
				</div>
				<div class="sleep-at blurb">Go to bed at:</div>
				<div id="bed-times"></div>
				<div class="bed-time-explanation blurb">Each sleep cycle is&nbsp;<em>90&nbsp;</em>minutes.</div>
				<div class="wake-up-at blurb">Try to wake up at:</div>
				<div id="wake-times"></div>
				<div class="wake-time-explanation blurb">You need&nbsp;<em>6&nbsp;</em>sleep cycles to wake up rested.</div>
			</div>
		</div>
		<footer class="site-footer">
			<div class="btn-container">
				<div class="bed-now blurb">
					<p>Going to bed now?</p>
					<p>Find out when you have to wake up.</p>
				</div>
				<a class="btn primary" href="#sleep-now" id="sleep-now">Sleep now</a>
			</div>
			<script src="javascripts/application.js" type="text/javascript"></script>
		</footer>
	</body>
</html>
